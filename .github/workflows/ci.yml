name: cpu-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: Install CPU deps
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.9.0
          pip install "transformers==4.57.6" "numpy<2.3" matplotlib
      - name: Tests that need no GPU and no vLLM
        env: { CUDA_VISIBLE_DEVICES: "" }
        run: |
          python tests/test_repo_integrity.py
          python tests/test_metrics.py
          python tests/test_store.py
          python tests/test_losses.py
          python tests/test_monitor.py
          python tests/test_policy_tiny.py
          python tests/test_score_hf_tiny.py
